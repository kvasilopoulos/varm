title: varm
url: https://kvasilopoulos.github.io/varm

template:
  params:
    bootswatch: cosmo

authors:
  Kostas Vasilopoulos:
    href: https://kvasilopoulos.com/

reference:

  - title: Estimation
    contents:
      - varm
      - var_select
      - lag_matrices
      - stability
      - bvarm
      - prior_minnesota
      - prior_triangular
      - lp
      - volatility

  - title: Uncertainty
    contents:
      - draws

  - title: Dynamics
    contents:
      - irf
      - fevd
      - hd
      - forecast

  - title: Identification
    contents:
      - identification
      - starts_with("id_")

  - title: Proxy SVAR
    contents:
      - varm_proxy
      - varm_proxy_robust
      - proxy_fstat

  - title: Plotting and tidying
    contents:
      - plot.varm_dyn
      - as.data.frame.varm_dyn


